name: Validate

# PEAK has no public stripped-game-libs package (unlike Lethal Company), and the
# game DLLs we compile against, Assembly-CSharp.dll, UnityEngine.dll, can't be
# redistributed. So CI can't actually `dotnet build`; the compile step lives on
# the maintainer's local machine where PEAK is installed. This workflow does the
# CI-friendly slice: validate that the project file parses and NuGet feeds work.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore + project parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Install .NET through the NAS artifact cache
        # setup-dotnet fetches the SDK from Microsoft; this takes the version global.json pins from
        # the NAS cache instead, and points NuGet at the cache as its only package source.
        env:
          CACHE: https://artifacts.nas.bryantserver.com
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$CACHE/builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh" -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$HOME/.dotnet" \
            --azure-feed "$CACHE/builds.dotnet.microsoft.com/dotnet"
          {
            echo "DOTNET_ROOT=$HOME/.dotnet"
            echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
            echo "DOTNET_NOLOGO=1"
          } >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.nuget/NuGet"
          cat > "$HOME/.nuget/NuGet/NuGet.Config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="$CACHE/api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
          </configuration>
          EOF

      - name: Restore (no compile)
        # `dotnet restore` parses the csproj, resolves NuGet packages from the
        # BepInEx + windows10ce feeds, and validates the dependency tree. It does
        # not attempt to compile against game DLLs, so it succeeds without them.
        # The SDK treats RestoreAdditionalProjectSources as a project-local property, so a -p
        # override cannot reach it; the checkout's copy of the feed list is pointed at the cache.
        run: |
          set -euo pipefail
          sed -i -e 's#https://nuget.bepinex.dev/#https://artifacts.nas.bryantserver.com/nuget.bepinex.dev/#' \
            -e 's#https://nuget.windows10ce.com/#https://artifacts.nas.bryantserver.com/nuget.windows10ce.com/#' \
            Directory.Build.targets
          dotnet restore
